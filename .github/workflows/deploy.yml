name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 内容 schema 与类型校验：frontmatter 不合规会在这里失败，而不是构建出坏页面
      - name: Check
        run: npm run check

      # SITE_URL / BASE_PATH 决定 canonical、sitemap 与 llms.txt 里的绝对地址。
      # 迁移到独立域名后，改这两个值即可（BASE_PATH 设为 /）。
      - name: Build site
        run: npm run build
        env:
          SITE_URL: https://git-flt.github.io
          BASE_PATH: /myblog

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
